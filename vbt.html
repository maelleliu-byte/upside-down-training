:root{
  --bg:#FBFAF7;--panel:#FFFFFF;--line:#E3DED2;--text:#0D3B33;--muted:#7D8A86;
  --accent:#0B9488;--accent-ink:#FFFFFF;--warn:#D98A2B;--bad:#C24A3D;--input:#F3F0E8;--fast:#1E8F55;
  --grid:rgba(13,59,51,.045);--chip:#E7F3F1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --sg:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --in:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#083F38;--panel:#0B3530;--line:#1B5A50;--text:#F6F4E8;--muted:#9FCFC7;
    --accent:#0B9488;--accent-ink:#F6F4E8;--input:#062F2A;--grid:rgba(246,244,232,.035);--chip:#0E4A42;
  }
}
:root[data-theme="dark"]{
  --bg:#083F38;--panel:#0B3530;--line:#1B5A50;--text:#F6F4E8;--muted:#9FCFC7;
  --accent:#0B9488;--accent-ink:#F6F4E8;--input:#062F2A;--grid:rgba(246,244,232,.035);--chip:#0E4A42;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--in);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:54px 54px;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:var(--sg);margin:0;letter-spacing:-.01em}
h1{font-weight:700;font-size:30px;line-height:1.1}
h2{font-weight:700;font-size:19px}
h3{font-weight:500;font-size:16px}
.brand{font:700 12px var(--sg);letter-spacing:.06em;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sync{font:400 12px var(--in);letter-spacing:0;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.err{background:var(--bad)}
.lede{color:var(--muted);margin:6px 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:17px}
.sec span{color:var(--muted);font-size:13px}
button{font:500 14px var(--in);color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--sg);font-weight:700;font-size:15px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{font:500 16px var(--in);color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:42px}
textarea{min-height:64px;resize:vertical;font-weight:400}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=date]{min-width:0}
.sess{display:block;width:100%;text-align:left}
.sess .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess .date{font:700 14px var(--sg);color:var(--accent)}
.sess .meta{color:var(--muted);font-size:13px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--text)}
.tag.halt{background:color-mix(in srgb,var(--warn) 20%,transparent)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);min-height:40px;margin-bottom:6px}
.status{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.status button{padding:0 12px;min-height:36px;font-size:13px;color:var(--muted)}
.status button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.block{border-left:3px solid var(--accent)}
.block.halt{border-left-color:var(--warn)}
.kind{font-size:12px;color:var(--muted)}
.zones{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:8px;scrollbar-width:none}
.zones button{white-space:nowrap;font-size:12px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.zones button.on{border-color:var(--accent);color:var(--text);background:var(--chip)}
.set{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.set .head{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:end}
.set .num{font:700 20px var(--sg);width:30px;color:var(--muted);padding-bottom:8px}
.pct{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:10px}
.reps label{position:relative;display:block}
.reps span{position:absolute;left:8px;top:4px;font-size:10px;color:var(--muted)}
.reps input{padding:16px 6px 4px 8px;font:500 17px var(--sg);min-height:48px}
.rpe{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:8px}
.stats{margin-top:10px;font-size:13px}
.stats .nums{display:flex;flex-wrap:wrap;gap:4px 14px}
.stats b{font:700 15px var(--sg)}
.stats .k{color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flag{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.flag.ok{border-color:var(--accent);color:var(--accent)}
.flag.warn{border-color:var(--warn);color:var(--warn)}
.flag.bad{border-color:var(--bad);color:var(--bad)}
.flag.zone{background:var(--chip);border-color:transparent}
.hint{color:var(--muted);font-size:13px}
.setact{display:flex;gap:4px}
.icon{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon:hover{background:var(--input)}
.icon svg{width:18px;height:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{min-height:56px;font:500 13px var(--sg);color:var(--muted)}
nav.tabs button[aria-current=page]{color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font:700 22px var(--sg)}
.kpi span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px}
td.n{font-family:var(--sg);font-weight:500}
.mvrow{display:grid;grid-template-columns:1fr 104px;gap:8px}
.mvrow2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.seg{display:inline-flex;gap:6px}
.seg button{font-size:13px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--text);background:var(--chip)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.overlay textarea{min-height:200px;font:400 12px ui-monospace,monospace}
.zone-ref td{font-size:13px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.grid3>:last-child{grid-column:span 2}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* Harmonisation UDT : Space Grotesk pour titres, chiffres, libellés, actions ; Inter pour le texte courant */
h1 .ac,h2 .ac{color:var(--accent)}
h1{font-size:32px;font-weight:700}
.brand{font:700 13px var(--sg);letter-spacing:.02em;color:var(--text);gap:10px}
.brand .mark{display:flex;align-items:center;gap:10px}

label.f{font:500 10.5px var(--sg);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,select{font-family:var(--sg);font-weight:500}
textarea{font-family:var(--in)}
.btn,.status button,.zones button,.seg button,nav.tabs button,.back{font-family:var(--sg)}
.tag{font:700 10.5px var(--sg);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);padding:4px 8px}
.tag.halt{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.flag{font-family:var(--sg);font-weight:500}
.kind,.hint,.lede,.pct{font-family:var(--in)}
.sess .date{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bnote{margin-top:10px}
label.f u{text-decoration:none;text-transform:none;letter-spacing:.02em}
.grid3,.grid2{align-items:end}
.grid3 label.f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnote textarea{min-height:52px}

.back svg{width:18px;height:18px}
.brand .mark>span{font:700 15px "Work Sans",var(--sg);letter-spacing:.02em}
.brand svg{width:30px;height:31px}
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}

.theme button svg{width:18px;height:18px}
.theme button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.brand svg{color:var(--logo)}
:root{--logo:#0B9488}
:root[data-theme="dark"]{--logo:#F6F4E8;--fast:#5DD39E}
.test{border:1px dashed var(--accent)}
.sesswrap{position:relative}
.dayorder{position:absolute;right:8px;bottom:8px;display:flex;gap:2px}
.dayorder .icon{width:30px;height:30px;border:1px solid var(--line);background:var(--panel)}
.dayorder .icon svg{width:16px;height:16px}
.sesswrap:has(.dayorder) .sess .tags{padding-right:72px}
.flag.fast{border-color:var(--fast);color:var(--fast)}
.reps input.fast{border-color:var(--fast);background:color-mix(in srgb,var(--fast) 18%,var(--input));box-shadow:inset 0 -3px 0 var(--fast)}
.reps input.slow{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--input));box-shadow:inset 0 -3px 0 var(--warn)}
.reps input.inT{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.replegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}

.fold svg{width:13px;height:13px}

<script>try{var t=localStorage.getItem("udt-vbt-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<div id="app"></div>
<nav class="tabs" aria-label="Navigation"><div class="in">
  <button data-act="tab" data-tab="list">Séances</button>
  <button data-act="tab" data-tab="profile">Profil L-V</button>
  <button data-act="tab" data-tab="settings">Mouvements</button>
</div></nav>
<script>
(function(){
"use strict";
/* ---------- Référentiel ---------- */
const DEFAULT_MOVES=[
  {id:"bsq",name:"Back Squat",type:"force",mvt:0.30,rm:null},
  {id:"boxsq",name:"Box Squat",type:"force",mvt:0.30,rm:null},
  {id:"pinbsq",name:"Pin Back Squat",type:"force",mvt:0.30,rm:null},
  {id:"fsq",name:"Front Squat",type:"force",mvt:0.30,rm:null},
  {id:"pinfsq",name:"Pin Front Squat",type:"force",mvt:0.30,rm:null},
  {id:"bench",name:"Bench Press",type:"force",mvt:0.17,rm:null},
  {id:"pinpress",name:"Pin Press",type:"force",mvt:0.17,rm:null},
  {id:"dl",name:"Deadlift",type:"force",mvt:0.15,rm:null},
  {id:"dldef",name:"Deficit Deadlift",type:"force",mvt:0.15,rm:null},
  {id:"blockdl",name:"Block Deadlift",type:"force",mvt:0.15,rm:null},
  {id:"ohp",name:"Shoulder Press",type:"force",mvt:0.19,rm:null},
  {id:"sn",name:"Snatch",type:"haltero",mvt:null,rm:null},
  {id:"psn",name:"Power Snatch",type:"haltero",mvt:null,rm:null},
  {id:"hsn",name:"Hang Snatch",type:"haltero",mvt:null,rm:null},
  {id:"hpsn",name:"Hang Power Snatch",type:"haltero",mvt:null,rm:null},
  {id:"cl",name:"Clean",type:"haltero",mvt:null,rm:null},
  {id:"pcl",name:"Power Clean",type:"haltero",mvt:null,rm:null},
  {id:"hcl",name:"Hang Clean",type:"haltero",mvt:null,rm:null},
  {id:"hpcl",name:"Hang Power Clean",type:"haltero",mvt:null,rm:null},
  {id:"bpcl",name:"Block Power Clean",type:"haltero",mvt:null,rm:null},
  {id:"pp",name:"Push Press",type:"haltero",mvt:null,rm:null},
  {id:"pj",name:"Push Jerk",type:"haltero",mvt:null,rm:null},
  {id:"jk",name:"Split Jerk",type:"haltero",mvt:null,rm:null},
  {id:"snp",name:"Snatch Pull",type:"haltero",mvt:null,rm:null},
  {id:"clp",name:"Clean Pull",type:"haltero",mvt:null,rm:null}
];
/* anciens noms par défaut -> nouveaux (les noms modifiés à la main ne sont pas touchés) */
const OLD_NAMES={bsq:["Back squat"],boxsq:["Box squat"],fsq:["Front squat"],bench:["Développé couché"],dl:["Soulevé de terre"],dldef:["Deficit deadlift"],ohp:["Développé militaire"],
  sn:["Arraché"],psn:["Power arraché","Power snatch"],hsn:["Hang arraché","Hang snatch"],cl:["Épaulé"],pcl:["Power épaulé","Power clean"],hcl:["Hang épaulé","Hang clean"],jk:["Jeté","Jerk"],snp:["Tirage arraché","Snatch pull"],clp:["Tirage épaulé","Clean pull"]};
const SETTINGS_VER=6;
const ZONES=[
  {k:"fmax",name:"Force maximale",min:null,max:0.50},
  {k:"facc",name:"Force accélération",min:0.50,max:0.75},
  {k:"fv",name:"Force-vitesse",min:0.75,max:1.00},
  {k:"vf",name:"Vitesse-force",min:1.00,max:1.30},
  {k:"vmax",name:"Vitesse maximale",min:1.30,max:null}
];
const ACC=[{k:"",name:"Barre seule",short:""},{k:"bl",name:"Bandes légères",short:"bandes L"},{k:"bm",name:"Bandes moyennes",short:"bandes M"},{k:"bh",name:"Bandes lourdes",short:"bandes H"},{k:"ch",name:"Chaînes",short:"chaînes"},{k:"bc",name:"Bandes + chaînes",short:"bandes + chaînes"},{k:"rb",name:"Reverse bands",short:"reverse bands"}];
function accOf(k){return ACC.find(a=>a.k===(k||""))||ACC[0]}

/* ---------- État ---------- */
const state={sessions:{},settings:{moves:clone(DEFAULT_MOVES),sensor:"",folders:[],ver:SETTINGS_VER},
  view:{name:"list",id:null},profileMove:"bsq",profileAcc:"",period:90,confirmDel:false,folder:(()=>{try{return localStorage.getItem("udt-vbt-folder")||"all"}catch(e){return "all"}})(),folderUI:null,confirmFolderDel:false,exportText:null};
const store={mode:"none",sb:null,uid:null,sync:"wait"};
const writing={},pending={},timers={},dirty=new Set();
let needRender=false;

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(s){if(s==null||s==="")return null;const n=parseFloat(String(s).replace(",",".").trim());return isFinite(n)?n:null}
function fmt(v,d=2){return v==null||!isFinite(v)?"–":v.toFixed(d).replace(".",",")}
function show(v){return v==null?"":String(v).replace(".",",")}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fdate(s){if(!s)return"Sans date";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}
function daysAgo(s){return (Date.now()-new Date(s+"T12:00:00").getTime())/864e5}

function normSettings(s){
  s=s&&typeof s==="object"?clone(s):{};
  if(!Array.isArray(s.moves)||!s.moves.length)s.moves=clone(DEFAULT_MOVES);
  if(typeof s.sensor!=="string")s.sensor="";
  if(!Array.isArray(s.folders))s.folders=[];
  if((s.ver||1)<SETTINGS_VER){
    s.moves.forEach(m=>{const o=OLD_NAMES[m.id];const d=DEFAULT_MOVES.find(x=>x.id===m.id);if(o&&d&&o.includes(m.name))m.name=d.name});
    const ids=DEFAULT_MOVES.map(x=>x.id);
    ["pinbsq","pinfsq","pinpress","dldef","blockdl","hpsn","hpcl","bpcl","pp","pj"].forEach(id=>{if(!s.moves.find(m=>m.id===id)){const d=clone(DEFAULT_MOVES.find(x=>x.id===id));const prev=ids[ids.indexOf(id)-1];const i=s.moves.findIndex(m=>m.id===prev);s.moves.splice(i<0?s.moves.length:i+1,0,d)}});
    s.migrated=true;
  }
  s.ver=SETTINGS_VER;
  return s;
}
function move(id){return state.settings.moves.find(m=>m.id===id)||{id,name:"Mouvement supprimé",type:"force",mvt:null,rm:null}}

/* ---------- Stockage (base Upside Down Training) ----------
 * Table public.vbt_journal : une ligne "settings" + une ligne "s-<id>" par séance,
 * par utilisateur connecté (RLS : chacun ne voit que ses données).
 * Copie locale par utilisateur pour un affichage instantané et le hors-ligne.
 */
const SB_URL='https://tltqtpbaaxiwwpvuzszt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsdHF0cGJhYXhpd3dwdnV6c3p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDA5NTQsImV4cCI6MjA5MzUxNjk1NH0.5LVedQ-ktLcTC6z2X0XIoqY-mqP9_tw-gzrt-KNfuuY';
let LS=null;
function loadLocal(){
  if(!LS)return false;
  try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);state.sessions=d.sessions||{};state.settings=normSettings(d.settings);delete state.settings.migrated;store.sync="local";return true}}catch(e){}
  return false;
}
function saveLocal(){if(!LS)return;try{localStorage.setItem(LS,JSON.stringify({sessions:state.sessions,settings:state.settings}));if(store.mode!=="db")store.sync="local"}catch(e){if(store.mode!=="db")store.sync="none"}}
function persist(key){
  saveLocal();
  if(!store.sb)return;
  dirty.add(key);
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>flush(key),500);
}
async function flush(key){
  if(writing[key]){pending[key]=true;return}
  writing[key]=true;let retry=false;
  try{
    const dk=key==="__settings"?"settings":"s-"+key;
    const s=key==="__settings"?state.settings:state.sessions[key];
    let r;
    if(s)r=await store.sb.from("vbt_journal").upsert({user_id:store.uid,doc_key:dk,data:clone(s),updated_at:new Date().toISOString()},{onConflict:"user_id,doc_key"});
    else r=await store.sb.from("vbt_journal").delete().eq("user_id",store.uid).eq("doc_key",dk);
    if(r.error)throw r.error;
    setSync("ok");
  }catch(e){
    if(!navigator.onLine||(e&&/fetch|network/i.test(e.message||"")))retry=true;
    else setSync("err");
  }
  writing[key]=false;
  if(retry){setSync("err","Hors ligne, nouvel essai…");setTimeout(()=>flush(key),3000+Math.random()*2000);return}
  if(pending[key]){pending[key]=false;flush(key)}else dirty.delete(key);
}
function setSync(s,msg){store.sync=s;store.syncMsg=msg||"";const el=document.getElementById("sync");if(el)el.outerHTML=syncHTML()}
function syncHTML(){
  const m={ok:["ok","Synchronisé"],err:["err",store.syncMsg||"Erreur de synchro"],local:["","Sur cet appareil"],none:["err","Non connecté à UDT"],wait:["","Connexion…"]}[store.sync]||["",""];
  return `<span class="sync" id="sync"><span class="dot ${m[0]}"></span>${esc(m[1])}</span>`;
}
async function pull(){
  const {data,error}=await store.sb.from("vbt_journal").select("doc_key,data").eq("user_id",store.uid);
  if(error)throw error;
  let sessions={},settings=null,mig=false;
  (data||[]).forEach(r=>{if(r.doc_key==="settings")settings=r.data;else if(r.doc_key.startsWith("s-"))sessions[r.doc_key.slice(2)]=r.data});
  dirty.forEach(k=>{if(k==="__settings")settings=state.settings;else if(state.sessions[k])sessions[k]=state.sessions[k];else delete sessions[k]});
  state.sessions=sessions;
  state.settings=normSettings(settings);if(state.settings.migrated){delete state.settings.migrated;mig=true}
  if(mig||!settings)persist("__settings");
  if(store.sync!=="err")store.sync="ok";
  saveLocal();
  if(!state.settings.moves.find(m=>m.id===state.profileMove))state.profileMove=state.settings.moves[0].id;
  if(editing())needRender=true;else render();
}
async function connect(){
  store.sync="wait";render();
  try{
    if(!window.supabase){setSync("none");return}
    const sb=window.supabase.createClient(SB_URL,SB_KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(!session||!session.user){setSync("none","Connecte-toi à l’app UDT");return}
    store.sb=sb;store.uid=session.user.id;store.mode="db";
    LS="udt-vbt-v1-"+store.uid;
    if(loadLocal()){store.sync="wait";render()}
    await pull();
    /* Retour sur l'onglet : on recharge pour récupérer ce qui a été saisi sur un autre appareil */
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!dirty.size)pull().catch(()=>setSync("err"))});
  }catch(e){setSync("err")}
}
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(needRender&&!editing()){needRender=false;render()}},60));

/* ---------- Calculs ---------- */
function setStats(set){
  const vals=(set.v||[]).filter(x=>x!=null&&x>0);
  if(!vals.length)return null;
  const best=Math.max(...vals),avg=vals.reduce((a,b)=>a+b,0)/vals.length,last=vals[vals.length-1],first=vals[0];
  const vl=vals.length>1?(best-last)/best*100:null;
  return {n:vals.length,best,avg,last,first,vl};
}
function zoneOf(v){return ZONES.find(z=>(z.min==null||v>=z.min)&&(z.max==null||v<z.max))}
function allPoints(mvId,period,acc){acc=acc||"";
  const pts=[];
  Object.values(state.sessions).forEach(s=>{
    if(period&&s.date&&daysAgo(s.date)>period)return;
    (s.blocks||[]).forEach(b=>{if(b.mv!==mvId||(b.acc||"")!==acc)return;(b.sets||[]).forEach(st=>{const k=setStats(st);if(k&&st.load>0)pts.push({load:st.load,v:k.best,date:s.date||"",sid:s.id,setId:st.id})})});
  });
  return pts;
}
function linfit(pts){
  const n=pts.length;if(n<3)return null;
  const loads=new Set(pts.map(p=>p.load));if(loads.size<3)return null;
  let sx=0,sy=0,sxx=0,sxy=0,syy=0;
  pts.forEach(p=>{sx+=p.load;sy+=p.v;sxx+=p.load*p.load;sxy+=p.load*p.v;syy+=p.v*p.v});
  const den=n*sxx-sx*sx;if(!den)return null;
  const b=(n*sxy-sx*sy)/den,a=(sy-b*sx)/n;
  const r=(n*sxy-sx*sy)/Math.sqrt(den*(n*syy-sy*sy));
  if(!(b<0))return null;
  return {a,b,r2:r*r,n};
}
const fitCache={};
function fitFor(mvId,acc){acc=acc||"";const key=mvId+"|"+acc;if(!(key in fitCache)){let p=allPoints(mvId,90,acc);if(p.length<4)p=allPoints(mvId,0,acc);fitCache[key]=linfit(p)}return fitCache[key]}
function slopeOf(pts){const L=new Set(pts.map(p=>p.load));if(L.size<2)return null;const n=pts.length;let sx=0,sy=0,sxx=0,sxy=0;pts.forEach(p=>{sx+=p.load;sy+=p.v;sxx+=p.load*p.load;sxy+=p.load*p.v});const d=n*sxx-sx*sx;if(!d)return null;const b=(n*sxy-sx*sy)/d;return b<0?b:null}
function suggestNext(b,st){
  const k=setStats(st);if(!k)return null;
  if(!(st.load>0))return {need:"load"};
  const lo=num(b.vmin),hi=num(b.vmax);if(lo==null&&hi==null)return {need:"target"};
  const vt=lo!=null&&hi!=null?(lo+hi)/2:lo!=null?lo+0.05:hi-0.05;
  const m=move(b.mv),acc=b.acc||"";let slope=null,src="";
  const f=fitFor(b.mv,acc);
  const today=b.sets.map(x=>({x,k:setStats(x)})).filter(o=>o.k&&o.x.load>0).map(o=>({load:o.x.load,v:o.k.best}));
  if(f){slope=f.b;src=acc?"ton profil "+accOf(acc).name.toLowerCase():"ton profil"}
  else if(slopeOf(today)){slope=slopeOf(today);src="tes séries du jour"}
  else if(!acc&&m.type==="force"&&m.rm>st.load&&m.mvt!=null&&k.best>m.mvt){slope=(m.mvt-k.best)/(m.rm-st.load);src="ton 1RM de référence"}
  else if(acc){const f0=fitFor(b.mv,"");if(f0){slope=f0.b;src="ton profil barre seule (approximatif avec résistance)"}}
  if(slope==null)return {need:"data"};
  const step=m.type==="haltero"?1:2.5;
  let load=st.load+(vt-k.best)/slope;
  load=Math.max(st.load*0.75,Math.min(st.load*1.25,load));
  load=Math.round(load/step)*step;
  return {load,vt,src,same:Math.abs(load-st.load)<step/2};
}
function clearFits(){for(const k in fitCache)delete fitCache[k]}

/* ---------- Rendu ---------- */
const ICON={
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',

function themeHTML(){const t=document.documentElement.dataset.theme;return `<div class="theme" role="group" aria-label="Thème"><button data-act="theme" data-v="dark" aria-pressed="${t==="dark"}" aria-label="Mode sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><button data-act="theme" data-v="light" aria-pressed="${t==="light"}" aria-label="Mode clair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>`}
function header(){return `<div class="brand"><span class="mark">${LOGO}<span>UPSIDE DOWN TRAINING</span></span>${syncHTML()}</div>`}

function render(){
  clearFits();
  const y=window.scrollY;
  const v=state.view.name;
  document.querySelectorAll("nav.tabs button").forEach(b=>{const t=b.dataset.tab;if((t===v)||(t==="list"&&v==="session"))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const app=document.getElementById("app");
  if(v==="session"&&state.sessions[state.view.id])app.innerHTML=viewSession(state.sessions[state.view.id]);
  else if(v==="profile")app.innerHTML=viewProfile();
  else if(v==="settings")app.innerHTML=viewSettings();
  else{state.view={name:"list",id:null};app.innerHTML=viewList()}
  window.scrollTo(0,y);
}

function created(s){return s.createdAt||s.updatedAt||0}
function byDay(dir){return (a,b)=>dir*(a.date||"").localeCompare(b.date||"")||((a.order??Infinity)-(b.order??Infinity))||created(a)-created(b)}
function folderOf(id){return (state.settings.folders||[]).find(f=>f.id===id)}
function inFilter(s){const f=state.folder;if(f==="all")return true;if(f==="none")return !s.folder||!folderOf(s.folder);return s.folder===f}
function setFolderFilter(f){state.folder=f;try{localStorage.setItem("udt-vbt-folder",f)}catch(e){}}
function upcoming(){return Object.values(state.sessions).filter(s=>s.status!=="done"&&inFilter(s)).sort(byDay(1))}
function doneList(){return Object.values(state.sessions).filter(s=>s.status==="done"&&inFilter(s)).sort(byDay(-1))}
function nextOrder(){return Object.values(state.sessions).reduce((m,s)=>Math.max(m,s.order==null?0:s.order),0)+1}
function sameDay(id){const s=state.sessions[id];return (s.status==="done"?doneList():upcoming()).filter(x=>(x.date||"")===(s.date||""))}
function moveSession(id,dir){
  const day=sameDay(id);const i=day.findIndex(s=>s.id===id),j=i+dir;if(i<0||j<0||j>=day.length)return;
  const x=day.splice(i,1)[0];day.splice(j,0,x);
  const slots=day.map(s=>s.order).filter(o=>o!=null);let n=nextOrder();while(slots.length<day.length)slots.push(n++);slots.sort((a,b)=>a-b);
  day.forEach((s,k)=>{if(s.order!==slots[k]){s.order=slots[k];persist(s.id)}});render();
}
function folderBar(){
  const fs=state.settings.folders||[];
  if(state.folder!=="all"&&state.folder!=="none"&&!folderOf(state.folder))state.folder="all";
  const hasNone=fs.length&&Object.values(state.sessions).some(s=>!s.folder||!folderOf(s.folder));
  const chip=(v,label,n)=>`<button data-act="folder" data-f="${v}" aria-pressed="${state.folder===v}">${label}${n!=null?` <span>${n}</span>`:""}</button>`;
  const count=id=>Object.values(state.sessions).filter(s=>s.folder===id).length;
  let bar=`<div class="folders" role="group" aria-label="Dossiers">${chip("all","Toutes")}${fs.map(f=>chip(f.id,ICON.folder+esc(f.name),count(f.id))).join("")}${hasNone?chip("none","Sans dossier"):""}<button data-act="folder-new" class="add">+ Dossier</button></div>`;
  const ui=state.folderUI;
  if(ui){bar+=`<div class="folderform"><input id="folder-name" placeholder="Ex : Cycle 16 sem · Bloc 3A" value="${esc(ui.mode==="rename"?(folderOf(state.folder)||{}).name||"":"")}"><button class="btn sm primary" data-act="folder-save">${ui.mode==="rename"?"Renommer":"Créer"}</button><button class="btn sm ghost" data-act="folder-cancel">Annuler</button></div>`}
  else if(folderOf(state.folder)){bar+=`<div class="folderact"><button class="btn sm ghost" data-act="folder-rename">Renommer</button><button class="btn sm ghost danger" data-act="folder-del">${state.confirmFolderDel?"Confirmer (les séances sont gardées)":"Supprimer le dossier"}</button></div>`}
  return bar;
}
function viewList(){
  const all=Object.values(state.sessions);
  const up=upcoming();
  const done=doneList();
  const card=(s,i,list)=>{
    const mvs=[...new Set((s.blocks||[]).map(b=>b.mv+"|"+(b.acc||"")))];
    const nSets=(s.blocks||[]).reduce((a,b)=>a+(b.sets||[]).length,0);
    const filled=(s.blocks||[]).reduce((a,b)=>a+(b.sets||[]).filter(st=>setStats(st)).length,0);
    const day=list.filter(x=>(x.date||"")===(s.date||""));const k=day.indexOf(s);
    const arrows=day.length>1?`<div class="dayorder">${k>0?`<button class="icon" data-act="move-up" data-id="${s.id}" aria-label="Placer avant dans la journée">${ICON.up}</button>`:""}${k<day.length-1?`<button class="icon" data-act="move-down" data-id="${s.id}" aria-label="Placer après dans la journée">${ICON.down}</button>`:""}</div>`:"";
    return `<div class="sesswrap"><button class="card sess" data-act="open" data-id="${s.id}">
      <div class="top"><span class="date">${esc(fdate(s.date))}</span><span class="hint">${filled}/${nSets} séries mesurées</span></div>
      <h3 style="margin-top:4px">${esc(s.title||"Séance sans titre")}</h3>
      ${state.folder==="all"&&folderOf(s.folder)?`<div class="fold">${ICON.folder}${esc(folderOf(s.folder).name)}</div>`:""}
      <div class="tags">${mvs.map(key=>{const [id,ac]=key.split("|");const m=move(id);const a=accOf(ac);return `<span class="tag ${m.type==="haltero"?"halt":""}">${esc(m.name)}${a.short?" + "+esc(a.short):""}</span>`}).join("")||'<span class="hint">Aucun exercice</span>'}</div>
    </button>${arrows}</div>`;
  };
  return `${header()}
  <div class="titlerow"><h1>Journal <span class="ac">VBT</span></h1>${themeHTML()}</div>
  <p class="lede">Planifie tes séances de force et d’haltéro, puis saisis la vitesse de chaque rep à la salle.</p>
  ${folderBar()}
  <button class="btn primary full" data-act="new-session">Planifier une séance</button>
  <div class="sec"><h2>À venir</h2><span>${up.length}</span></div>
  <div class="stack">${up.length?up.map((x,i)=>card(x,i,up)).join(""):'<div class="empty">Aucune séance planifiée. Crée la prochaine pour préparer charges, reps et fourchettes de vitesse.</div>'}</div>
  <div class="sec"><h2>Réalisées</h2><span>${done.length}</span></div>
  <div class="stack">${done.length?done.map((x,i)=>card(x,i,done)).join(""):'<div class="empty">Les séances marquées « Faite » apparaîtront ici.</div>'}</div>`;
}

function moveOptions(sel){
  const g=t=>state.settings.moves.filter(m=>m.type===t).map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.name)}</option>`).join("");
  let extra="";if(sel&&!state.settings.moves.find(m=>m.id===sel))extra=`<option value="${sel}" selected>Mouvement supprimé</option>`;
  return `${extra}<optgroup label="Force · vitesse moyenne">${g("force")}</optgroup><optgroup label="Haltéro · vitesse pic">${g("haltero")}</optgroup>`;
}

function viewSession(s){
  return `${header()}<button class="back" data-act="back">${ICON.back}Séances</button>
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="status" role="group" aria-label="Statut">
      <button data-act="status" data-v="planned" aria-pressed="${s.status!=="done"}">Planifiée</button>

    </div>
  </div>
  ${s.source?`<p class="hint" style="margin:0 0 10px">Programmée depuis Séance +. Les modifications faites dans l’app remplacent cette séance tant qu’aucune vitesse n’est saisie.</p>`:""}
  <div class="card stack">
    <div class="grid2">
      <div><label class="f" for="f-date">Date</label><input id="f-date" type="date" data-sf="date" value="${esc(s.date)}"></div>
      <div><label class="f" for="f-sensor">Capteur</label><input id="f-sensor" data-sf="sensor" value="${esc(s.sensor)}" placeholder="Enode, Vitruve…"></div>
    </div>
    <div><label class="f" for="f-title">Titre</label><input id="f-title" data-sf="title" value="${esc(s.title)}" placeholder="ME lower, DE squat, Haltéro technique…"></div>
    <div><label class="f" for="f-folder">Dossier (bloc, cycle…)</label><select id="f-folder" data-ff="folder"><option value="">Sans dossier</option>${(state.settings.folders||[]).map(f=>`<option value="${f.id}" ${s.folder===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}</select></div>
    <div><label class="f" for="f-notes">Notes (forme du jour, sommeil, douleurs…)</label><textarea id="f-notes" data-sf="notes">${esc(s.notes)}</textarea></div>

  <div class="sec"><h2>Récap de la séance</h2></div>
  <div id="recap">${recapHTML(s)}</div>
  <p class="hint" style="margin-top:18px">Tout est enregistré automatiquement à chaque saisie, pas besoin de valider.</p>
  <div class="grid2" style="margin-top:14px">

    <button class="btn danger" data-act="del-session">${state.confirmDel?"Confirmer la suppression":"Supprimer la séance"}</button>
  </div>`;
}

function viewBlock(b,i){
  const m=move(b.mv),halt=m.type==="haltero";
  const zoneBtns=halt?"":`<div class="zones" aria-label="Remplir la cible depuis une zone">${ZONES.map(z=>`<button data-act="zone" data-b="${b.id}" data-z="${z.k}" class="${num(b.vmin)===z.min&&num(b.vmax)===z.max?"on":""}">${z.name}</button>`).join("")}</div>`;
  return `<div class="card block ${halt?"halt":""}" style="margin-top:14px">
    <div class="row">
      <div class="grow"><label class="f" for="mv-${b.id}">Exercice ${i+1}</label><select id="mv-${b.id}" data-bf="mv" data-b="${b.id}">${moveOptions(b.mv)}</select></div>
      <button class="icon" style="margin-top:18px" data-act="del-block" data-b="${b.id}" aria-label="Supprimer l’exercice">${ICON.del}</button>
    </div>
    ${halt?"":`<div style="margin-top:10px"><label class="f" for="acc-${b.id}">Résistance accommodante</label><select id="acc-${b.id}" data-bf="acc" data-b="${b.id}">${ACC.map(a=>`<option value="${a.k}" ${(b.acc||"")===a.k?"selected":""}>${a.name}</option>`).join("")}</select></div>`}
    <div class="kind" style="margin-top:6px">${halt?"Saisie : vitesse pic de chaque rep (m/s)":"Saisie : vitesse moyenne de chaque rep (m/s)"}${m.rm?` · 1RM réf. ${show(m.rm)} kg`:""}</div>
    <div class="row" style="margin-top:10px;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <div><label class="f">Mode</label><div class="status" role="group" aria-label="Mode de charge">
        <button data-act="calib" data-b="${b.id}" data-v="1" aria-pressed="${b.calibrated!==false}">Calibrée</button>
        <button data-act="calib" data-b="${b.id}" data-v="0" aria-pressed="${b.calibrated===false}">Charge fixe</button>
      </div></div>
      <div style="flex:1;min-width:90px"><label class="f" for="rest-${b.id}">Repos</label><input id="rest-${b.id}" data-bt="rest" data-b="${b.id}" value="${esc(b.rest||"")}" placeholder="1:20, 3:00…"></div>
    </div>
    <div class="kind" style="margin-top:6px">${b.calibrated===false?"Charge fixe : la vitesse est mesurée, la charge ne bouge pas.":"Calibrée : la charge s’ajuste pour rester dans la plage de vitesse."}</div>

      <div><label class="f">Cible min <u>m/s</u></label><input inputmode="decimal" data-bf="vmin" data-b="${b.id}" value="${show(b.vmin)}" placeholder="0,70"></div>
      <div><label class="f">Cible max <u>m/s</u></label><input inputmode="decimal" data-bf="vmax" data-b="${b.id}" value="${show(b.vmax)}" placeholder="0,85"></div>
      <div><label class="f">Perte max <u>%</u></label><input inputmode="decimal" data-bf="vlMax" data-b="${b.id}" value="${show(b.vlMax)}" placeholder="20"></div>
    </div>
    ${zoneBtns}
    ${num(b.vmin)!=null||num(b.vmax)!=null?'<div class="replegend"><span><i style="background:var(--fast)"></i>Trop rapide</span><span><i style="background:var(--accent)"></i>Dans la cible</span><span><i style="background:var(--warn)"></i>Trop lent</span></div>':""}
    <div class="bnote"><label class="f" for="bn-${b.id}">Notes sur le mouvement</label><textarea id="bn-${b.id}" data-bn="${b.id}" placeholder="Consignes, tempo, stance, hauteur du déficit, blocs, sangles…">${esc(b.note)}</textarea></div>
    ${(b.sets||[]).map((st,j)=>viewSet(b,st,j)).join("")}
    <button class="btn full ghost" style="margin-top:12px" data-act="add-set" data-b="${b.id}">Ajouter une série</button>
  </div>`;
}

function viewSet(b,st,j){
  const reps=Math.max(1,st.reps||1);const v=st.v||[];
  let inputs="";for(let r=0;r<reps;r++)inputs+=`<label><span>R${r+1}</span><input inputmode="decimal" aria-label="Série ${j+1} rep ${r+1}" class="${repCls(b,v[r])}" data-vf="${r}" data-b="${b.id}" data-s="${st.id}" value="${show(v[r])}" placeholder="–"></label>`;
  return `<div class="set" id="set-${st.id}">
    <div class="head">
      <div class="num">${j+1}</div>
      <div><label class="f">Charge <u>kg</u></label><input inputmode="decimal" data-tf="load" data-b="${b.id}" data-s="${st.id}" value="${show(st.load)}"><div class="pct" id="pct-${st.id}">${pctHTML(b,st)}</div></div>
      <div><label class="f">Reps</label><input inputmode="numeric" data-tf="reps" data-b="${b.id}" data-s="${st.id}" value="${st.reps||""}"><div class="pct"></div></div>
      <div class="setact" style="padding-bottom:19px">
        <button class="icon" data-act="dup-set" data-b="${b.id}" data-s="${st.id}" aria-label="Dupliquer la série">${ICON.copy}</button>
        <button class="icon" data-act="del-set" data-b="${b.id}" data-s="${st.id}" aria-label="Supprimer la série">${ICON.del}</button>
      </div>
    </div>
    <div class="reps">${inputs}</div>
    <div class="rpe">
      <div><label class="f">RPE / RIR</label><input data-tf="rpe" data-b="${b.id}" data-s="${st.id}" value="${esc(st.rpe)}" placeholder="8 / 2"></div>

    </div>
    <div class="stats" id="st-${st.id}">${statsHTML(b,st)}</div>
  </div>`;
}
function pctHTML(b,st){const m=move(b.mv);return m.rm&&st.load?`${Math.round(st.load/m.rm*100)} % 1RM`:""}

function statsHTML(b,st){
  const m=move(b.mv),halt=m.type==="haltero",k=setStats(st);
  if(!k)return `<span class="hint">${b.vmin!=null||b.vmax!=null?`Cible : ${fmt(num(b.vmin))} – ${fmt(num(b.vmax))} m/s`:"Pas encore de vitesse saisie."}</span>`;
  const lbl=halt?"pic":"moy.";
  let nums=`<div class="nums">
    <span><span class="k">Meilleure </span><b>${fmt(k.best)}</b></span>
    <span><span class="k">Moyenne </span><b>${fmt(k.avg)}</b></span>
    <span><span class="k">Dernière </span><b>${fmt(k.last)}</b></span>
    ${k.vl!=null?`<span><span class="k">Perte </span><b>${fmt(k.vl,0)} %</b></span>`:""}
    ${!halt&&st.load>0?`<span><span class="k">Puiss. ≈ </span><b>${Math.round(st.load*9.81*k.avg)} W</b></span>`:""}
  </div>`;
  const flags=[];
  if(!halt){const z=zoneOf(k.best);if(z)flags.push(`<span class="flag zone">${z.name}</span>`)}
  const lo=num(b.vmin),hi=num(b.vmax);
  if(lo!=null||hi!=null){
    const fixed=b.calibrated===false;
    if(lo!=null&&k.best<lo)flags.push(`<span class="flag warn">Sous la cible${fixed?"":" : baisser la charge"}</span>`);
    else if(hi!=null&&k.best>hi)flags.push(`<span class="flag fast">Au-dessus de la cible${fixed?"":" : monter la charge"}</span>`);
    else flags.push(`<span class="flag ok">Dans la cible</span>`);
  }
  const vlm=num(b.vlMax);
  if(vlm!=null&&k.vl!=null&&k.vl>vlm)flags.push(`<span class="flag bad">Perte &gt; ${fmt(vlm,0)} % : stop</span>`);
  const f=fitFor(b.mv,b.acc);
  if(f&&st.load>0){const pred=f.a+f.b*st.load;if(pred>0){const d=(k.best-pred)/pred*100;flags.push(`<span class="flag ${d<=-8?"bad":d<=-4?"warn":""}">vs profil ${d>=0?"+":""}${fmt(d,0)} %</span>`)}}
  let sug="";
  const lastM=[...b.sets].reverse().find(x=>setStats(x));
  if(b.calibrated!==false&&lastM&&lastM.id===st.id){const g=suggestNext(b,st);
    const msg=t=>`<div class="suggest"><span class="k"><b style="font-size:13px">Série suivante :</b> ${t}</span></div>`;
    if(g&&g.need==="load")sug=msg("indique la charge de cette série pour obtenir une charge suggérée.");
    else if(g&&g.need==="target")sug=msg("renseigne une cible min ou max (m/s), ou touche un bouton de zone, pour obtenir une charge suggérée.");
    else if(g&&g.need==="data")sug=msg(`fais une 2e série à une autre charge, ou ${m.type==="force"&&!b.acc?"renseigne ton 1RM dans Mouvements":"construis ton profil avec un test"}, pour obtenir une charge suggérée.`);
    else if(g)sug=`<div class="suggest"><div class="grow"><span class="k">Série suivante</span><br><b>${g.same?"Garde "+show(g.load)+" kg":"≈ "+show(g.load)+" kg"}</b> <span class="k">pour viser ${fmt(g.vt)} m/s</span><div class="src">Calcul basé sur ${esc(g.src)}</div></div>${g.same?"":`<button class="btn sm" data-act="apply-sug" data-b="${b.id}" data-s="${st.id}" data-l="${g.load}">Appliquer</button>`}</div>`;}
  return nums+(flags.length?`<div class="flags">${flags.join("")}</div>`:"")+sug;
}

/* ---------- Profil charge-vitesse ---------- */
function viewProfile(){
  const m=move(state.profileMove),halt=m.type==="haltero";

  const f=linfit(pts);

  const per=[[30,"30 j"],[90,"90 j"],[0,"Tout"]];
  // Historique par séance
  const bySess={};
  pts.forEach(p=>{(bySess[p.sid]=bySess[p.sid]||[]).push(p)});
  const hist=Object.entries(bySess).map(([sid,ps])=>{const top=ps.reduce((a,p)=>p.load>a.load||(p.load===a.load&&p.v>a.v)?p:a,ps[0]);return {date:ps[0].date,top,best:Math.max(...ps.map(p=>p.v)),n:ps.length}}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let bestByLoad="";
  if(halt&&pts.length){
    const g={};pts.forEach(p=>{g[p.load]=Math.max(g[p.load]||0,p.v)});
    bestByLoad=`<div class="sec"><h2>Meilleur pic par charge</h2></div><div class="card tbl"><table><thead><tr><th>Charge</th><th>Pic max</th><th>% 1RM</th></tr></thead><tbody>${Object.keys(g).map(Number).sort((a,b)=>b-a).map(l=>`<tr><td class="n">${show(l)} kg</td><td class="n">${fmt(g[l])} m/s</td><td>${m.rm?Math.round(l/m.rm*100)+" %":"–"}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `${header()}
  <h1>Profil <span class="ac">charge-vitesse</span></h1>
  <p class="lede">Construit automatiquement à partir de toutes les séries saisies dans tes séances : la meilleure rep de chaque série, placée selon sa charge. La droite sert à estimer ta forme du jour et ton 1RM.</p>
  <div class="card stack">
    <div><label class="f" for="pm">Mouvement</label><select id="pm" data-pf="move">${moveOptions(m.id)}</select></div>
    ${halt?"":`<div><label class="f" for="pacc">Résistance</label><select id="pacc" data-pf="acc">${ACC.map(a=>`<option value="${a.k}" ${pacc===a.k?"selected":""}>${a.name}</option>`).join("")}</select></div>`}
    <div class="seg" role="group" aria-label="Période">${per.map(([d,l])=>`<button data-act="period" data-d="${d}" aria-pressed="${state.period===d}">${l}</button>`).join("")}</div>
  </div>
  <div class="card" style="margin-top:12px">
    ${pts.length?chartSVG(pts,f,halt?null:m.mvt,e1):'<div class="hint" style="padding:30px 4px;text-align:center">Pas encore de données pour ce mouvement sur la période.</div>'}
    ${pts.length?`<div class="legend"><span><i style="background:var(--accent)"></i>14 derniers jours</span><span><i style="background:var(--muted)"></i>Plus ancien</span>${!halt&&m.mvt?`<span><i style="background:var(--bad)"></i>MVT ${fmt(m.mvt)} m/s</span>`:""}</div>`:""}
  </div>
  <div class="kpis" style="margin-top:12px">
    <div class="card kpi"><b>${pts.length}</b><span>séries</span></div>
    <div class="card kpi"><b>${f?fmt(f.r2):"–"}</b><span>R² de la droite</span></div>
    <div class="card kpi"><b>${e1&&e1>0?Math.round(e1):"–"}</b><span>${halt?"1RM (réf.) "+(m.rm?show(m.rm):"–"):"1RM estimé (kg)"}</span></div>
  </div>
  ${f?`<p class="hint" style="margin-top:10px">Pente : ${fmt(f.b*100,2)} m/s par 100 kg. ${halt?"":"L’estimation du 1RM reste indicative : elle dépend de la MVT réglée dans Mouvements et de charges assez lourdes dans le profil."}</p>`:`<p class="hint" style="margin-top:10px">Il faut au moins 3 charges différentes pour tracer la droite.</p>`}
  <div class="card test" style="margin-top:16px">
    <h3>Tester ce mouvement</h3>
    <p class="hint" style="margin:6px 0 12px">Crée une séance de test prête à remplir : 5 paliers croissants (≈ 40, 55, 70, 80, 90 % 1RM, en 3-3-2-2-1 reps). ${m.rm?"Les charges sont calculées depuis ton 1RM de référence.":"Renseigne ton 1RM dans Mouvements pour que les charges soient calculées, sinon tu les saisis toi-même."}</p>
    <button class="btn primary full" data-act="profile-test">Créer un test ${esc(m.name)}</button>
  </div>
  ${bestByLoad}
  <div class="sec"><h2>Dernières séances</h2></div>

}

function chartSVG(pts,f,mvt,e1){
  const W=340,H=228,L=38,R=10,T=20,B=30;
  let xmin=Math.min(...pts.map(p=>p.load)),xmax=Math.max(...pts.map(p=>p.load));
  if(e1&&e1>xmax&&e1<xmax*1.6)xmax=e1;
  const xr=Math.max(10,xmax-xmin);xmin=Math.max(0,xmin-xr*.08);xmax=xmax+xr*.08;
  let ymax=Math.max(...pts.map(p=>p.v))*1.1,ymin=Math.min(...pts.map(p=>p.v),mvt||9)*0.85;
  ymin=Math.max(0,Math.floor(ymin*10)/10);ymax=Math.ceil(ymax*10)/10;if(ymax-ymin<0.3)ymax=ymin+0.3;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  let g="";
  const ys=[];for(let i=0;i<=4;i++)ys.push(ymin+(ymax-ymin)*i/4);
  ys.forEach(y=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(y)}</text>`});
  for(let i=0;i<=4;i++){const x=xmin+(xmax-xmin)*i/4;g+=`<text x="${X(x)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(x)}</text>`}
  g+=`<text x="${W-R}" y="${H-0}" text-anchor="end" font-size="10" fill="var(--muted)">kg</text><text x="4" y="9" font-size="10" fill="var(--muted)">m/s</text>`;
  if(mvt&&mvt>=ymin&&mvt<=ymax)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(mvt)}" y2="${Y(mvt)}" stroke="var(--bad)" stroke-dasharray="3 4" stroke-width="1.2"/>`;
  if(f){const x1=xmin,x2=xmax;g+=`<line x1="${X(x1)}" y1="${Y(f.a+f.b*x1)}" x2="${X(x2)}" y2="${Y(f.a+f.b*x2)}" clip-path="url(#cp)" stroke="var(--text)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 4"/>`}
  if(e1&&e1>=xmin&&e1<=xmax&&mvt)g+=`<circle cx="${X(e1)}" cy="${Y(mvt)}" r="5" fill="none" stroke="var(--bad)" stroke-width="2"/>`;
  pts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{const recent=p.date&&daysAgo(p.date)<=14;g+=`<circle cx="${X(p.load)}" cy="${Y(p.v)}" r="4.5" fill="${recent?"var(--accent)":"var(--muted)"}" fill-opacity="${recent?1:.55}"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nuage charge-vitesse" font-family="Inter, sans-serif"><defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs>${g}</svg>`;
}

function csv(){
  const q=s=>{s=String(s==null?"":s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const c=v=>v==null?"":fmt(v);
  const rows=[["Date","Dossier","Séance","Statut","Mouvement","Type","Série","Charge (kg)","% 1RM","Reps","Vitesses (m/s)","Meilleure","Moyenne","Dernière","Perte (%)","Zone","Cible min","Cible max","RPE/RIR","Résistance","Capteur","Note série","Note exercice","Mode","Repos"]];
  Object.values(state.sessions).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(s=>(s.blocks||[]).forEach(b=>{const m=move(b.mv);(b.sets||[]).forEach((st,j)=>{
    const k=setStats(st);const z=k&&m.type==="force"?zoneOf(k.best):null;
    rows.push([s.date,(folderOf(s.folder)||{}).name||"",s.title,s.status==="done"?"Faite":"Planifiée",m.name,m.type==="force"?"Force (moy.)":"Haltéro (pic)",j+1,st.load==null?"":show(st.load),m.rm&&st.load?Math.round(st.load/m.rm*100):"",st.reps,(st.v||[]).filter(x=>x!=null).map(x=>fmt(x)).join(" | "),k?c(k.best):"",k?c(k.avg):"",k?c(k.last):"",k&&k.vl!=null?fmt(k.vl,1):"",z?z.name:"",show(num(b.vmin)),show(num(b.vmax)),st.rpe,accOf(b.acc).name,s.sensor,st.note,b.note||"",b.calibrated===false?"Charge fixe":"Calibrée",b.rest||""]);
  })}));
  return "\uFEFF"+rows.map(r=>r.map(q).join(";")).join("\n");
}

/* ---------- Actions ---------- */
function cur(){return state.sessions[state.view.id]}
function blk(s,id){return (s.blocks||[]).find(b=>b.id===id)}
function touch(s){s.updatedAt=Date.now();clearFits();persist(s.id)}
function newSet(from){return {id:uid(),load:from?from.load:null,reps:from?from.reps:3,v:[],rpe:"",note:""}}
function newBlock(mv){const m=move(mv);return {id:uid(),mv,note:"",rest:"",calibrated:true,vmin:null,vmax:null,vlMax:m.type==="force"?20:null,sets:[newSet()]}}
function lastMove(){const s=Object.values(state.sessions).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];const b=s&&s.blocks&&s.blocks[s.blocks.length-1];return b?b.mv:state.settings.moves[0].id}
function open(id){state.view={name:"session",id};state.confirmDel=false;render();window.scrollTo(0,0)}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,s=cur();
  if(a!=="del-session")state.confirmDel=false;
  if(a!=="folder-del")state.confirmFolderDel=false;
  switch(a){
    case "tab":state.view={name:t.dataset.tab,id:null};state.exportText=null;render();window.scrollTo(0,0);break;
    case "back":state.view={name:"list",id:null};render();window.scrollTo(0,0);break;
    case "open":open(t.dataset.id);break;
    case "new-session":{const id=uid();state.sessions[id]={id,folder:folderOf(state.folder)?state.folder:"",order:nextOrder(),createdAt:Date.now(),date:today(),title:"",status:"planned",sensor:state.settings.sensor||"",notes:"",blocks:[newBlock(lastMove())],updatedAt:Date.now()};persist(id);open(id);break}
    case "status":if(t.dataset.v!=="done"&&s.status==="done")s.order=nextOrder();s.status=t.dataset.v;touch(s);render();break;
    case "add-block":{const prev=s.blocks[s.blocks.length-1];s.blocks.push(newBlock(prev?prev.mv:lastMove()));touch(s);render();break}
    case "del-block":s.blocks=s.blocks.filter(b=>b.id!==t.dataset.b);touch(s);render();break;
    case "add-set":{const b=blk(s,t.dataset.b);b.sets.push(newSet(b.sets[b.sets.length-1]));touch(s);render();break}
    case "dup-set":{const b=blk(s,t.dataset.b);const i=b.sets.findIndex(x=>x.id===t.dataset.s);b.sets.splice(i+1,0,newSet(b.sets[i]));touch(s);render();break}
    case "del-set":{const b=blk(s,t.dataset.b);b.sets=b.sets.filter(x=>x.id!==t.dataset.s);touch(s);render();break}
    case "calib":{const b=blk(s,t.dataset.b);b.calibrated=t.dataset.v==="1";touch(s);render();break}
    case "zone":{const b=blk(s,t.dataset.b);const z=ZONES.find(z=>z.k===t.dataset.z);b.vmin=z.min;b.vmax=z.max;touch(s);render();break}
    case "dup-session":{const id=uid();const c=clone(s);c.id=id;c.status="planned";c.date=today();c.title=(s.title||"Séance")+" (copie)";c.blocks.forEach(b=>{b.id=uid();b.sets.forEach(st=>{st.id=uid();st.v=[];st.rpe="";st.note=""})});c.updatedAt=Date.now();c.createdAt=Date.now();c.order=nextOrder();state.sessions[id]=c;persist(id);open(id);break}
    case "del-session":if(!state.confirmDel){state.confirmDel=true;render()}else{const id=s.id;delete state.sessions[id];persist(id);state.confirmDel=false;state.view={name:"list",id:null};render()}break;
    case "apply-sug":{const b=blk(s,t.dataset.b);const i=b.sets.findIndex(x=>x.id===t.dataset.s);const L=Number(t.dataset.l);
      let nx=b.sets[i+1];if(nx&&setStats(nx))nx=null;
      if(nx)nx.load=L;else{const ns=newSet(b.sets[i]);ns.load=L;b.sets.splice(i+1,0,ns)}
      touch(s);render();break}
    case "folder":setFolderFilter(t.dataset.f);state.folderUI=null;state.confirmFolderDel=false;render();break;
    case "folder-new":state.folderUI={mode:"new"};state.confirmFolderDel=false;render();setTimeout(()=>{const i=document.getElementById("folder-name");if(i)i.focus()},30);break;
    case "folder-rename":state.folderUI={mode:"rename"};render();setTimeout(()=>{const i=document.getElementById("folder-name");if(i)i.focus()},30);break;
    case "folder-cancel":state.folderUI=null;render();break;
    case "folder-save":{const i=document.getElementById("folder-name");const name=(i&&i.value||"").trim();if(!name){if(i)i.focus();break}
      if(state.folderUI&&state.folderUI.mode==="rename"){const f=folderOf(state.folder);if(f)f.name=name}
      else{const f={id:"f"+uid(),name};(state.settings.folders=state.settings.folders||[]).push(f);setFolderFilter(f.id)}
      state.folderUI=null;persist("__settings");render();break}
    case "folder-del":{if(!state.confirmFolderDel){state.confirmFolderDel=true;render();break}
      const id=state.folder;state.settings.folders=(state.settings.folders||[]).filter(f=>f.id!==id);
      Object.values(state.sessions).forEach(x=>{if(x.folder===id){x.folder="";touch(x)}});
      state.confirmFolderDel=false;setFolderFilter("all");persist("__settings");render();break}
    case "move-up":moveSession(t.dataset.id,-1);break;
    case "move-down":moveSession(t.dataset.id,1);break;
    case "theme":document.documentElement.dataset.theme=t.dataset.v;try{localStorage.setItem("udt-vbt-theme",t.dataset.v)}catch(_){}render();break;
    case "profile-test":{const m=move(state.profileMove);const id=uid();const pcts=[40,55,70,80,90],reps=[3,3,2,2,1];
      const blk0={id:uid(),mv:m.id,note:"Test de profil : échauffement, puis charges croissantes. 2 à 3 min de repos, intention maximale sur chaque rep. Ne pas aller à l’échec.",vmin:null,vmax:null,vlMax:null,
        sets:pcts.map((p,i)=>({id:uid(),load:m.rm?Math.round(m.rm*p/100/2.5)*2.5:null,reps:reps[i],v:[],rpe:"",note:m.rm?"":`≈ ${p} % 1RM`}))};
      state.sessions[id]={id,folder:folderOf(state.folder)?state.folder:"",order:nextOrder(),createdAt:Date.now(),date:today(),title:"Test profil L-V : "+m.name,status:"planned",sensor:state.settings.sensor||"",notes:"",blocks:[blk0],updatedAt:Date.now()};persist(id);open(id);break}
    case "period":state.period=Number(t.dataset.d);render();break;
    case "add-move":state.settings.moves.push({id:"m"+uid(),name:"Nouveau mouvement",type:"force",mvt:0.3,rm:null});persist("__settings");render();break;
    case "del-move":state.settings.moves=state.settings.moves.filter(m=>m.id!==t.dataset.m);if(!state.settings.moves.length)state.settings.moves=clone(DEFAULT_MOVES);persist("__settings");render();break;
    case "export":{
      const text=csv();const name="journal-vbt-"+today()+".csv";
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);state.exportText=null}catch(err){state.exportText=text}
      render();break}
  }
});

document.addEventListener("input",e=>{
  const el=e.target;const s=cur();
  if(el.dataset.sf&&s){s[el.dataset.sf]=el.value;if(el.dataset.sf==="sensor"){state.settings.sensor=el.value;persist("__settings")}touch(s);return}
  if(el.dataset.bt&&s){const b=blk(s,el.dataset.b);b[el.dataset.bt]=el.value;touch(s);return}
  if(el.dataset.bn&&s){const b=blk(s,el.dataset.bn);b.note=el.value;touch(s);return}
  if(el.dataset.bf&&s&&el.dataset.bf!=="mv"&&el.dataset.bf!=="acc"){const b=blk(s,el.dataset.b);b[el.dataset.bf]=num(el.value);touch(s);refreshBlock(b);return}
  if(el.dataset.tf&&s){const b=blk(s,el.dataset.b),st=b.sets.find(x=>x.id===el.dataset.s);const f=el.dataset.tf;
    if(f==="load"){st.load=num(el.value);touch(s);const p=document.getElementById("pct-"+st.id);if(p)p.innerHTML=pctHTML(b,st);refreshBlock(b);return}
    if(f==="rpe"||f==="note"){st[f]=el.value;touch(s);return}
    return}
  if(el.dataset.vf!=null&&s){const b=blk(s,el.dataset.b),st=b.sets.find(x=>x.id===el.dataset.s);st.v=st.v||[];st.v[+el.dataset.vf]=num(el.value);for(let i=0;i<st.v.length;i++)if(st.v[i]===undefined)st.v[i]=null;touch(s);refreshBlock(b);return}
  if(el.dataset.mf){const m=state.settings.moves.find(x=>x.id===el.dataset.m);if(!m)return;const f=el.dataset.mf;if(f==="name"){m.name=el.value;persist("__settings")}else if(f==="rm"||f==="mvt"){m[f]=num(el.value);persist("__settings")}}
});
document.addEventListener("keydown",e=>{if(e.target.id==="folder-name"&&e.key==="Enter"){e.preventDefault();const b=document.querySelector("[data-act=folder-save]");if(b)b.click()}});
document.addEventListener("change",e=>{
  const el=e.target;const s=cur();
  if(el.dataset.ff==="folder"&&s){s.folder=el.value;touch(s);return}
  if(el.dataset.bf==="acc"&&s){const b=blk(s,el.dataset.b);b.acc=el.value;touch(s);render();return}
  if(el.dataset.bf==="mv"&&s){const b=blk(s,el.dataset.b);b.mv=el.value;const m=move(b.mv);if(m.type==="haltero"){b.acc="";if(b.vlMax===20)b.vlMax=null}if(m.type==="force"&&b.vlMax==null)b.vlMax=20;touch(s);render();return}
  if(el.dataset.tf==="reps"&&s){const b=blk(s,el.dataset.b),st=b.sets.find(x=>x.id===el.dataset.s);let n=parseInt(el.value,10);if(!(n>0))n=1;n=Math.min(n,20);st.reps=n;st.v=(st.v||[]).slice(0,n);touch(s);render();return}
  if(el.dataset.mf==="type"){const m=state.settings.moves.find(x=>x.id===el.dataset.m);m.type=el.value;if(m.type==="force"&&m.mvt==null)m.mvt=0.3;persist("__settings");render();return}
  if(el.dataset.pf==="acc"){state.profileAcc=el.value;render();return}
  if(el.dataset.pf==="move"){state.profileMove=el.value;render();return}
});
function repCls(b,v){if(v==null||!(v>0))return "";const lo=num(b.vmin),hi=num(b.vmax);if(lo==null&&hi==null)return "";if(lo!=null&&v<lo)return "slow";if(hi!=null&&v>hi)return "fast";return "inT"}
function refreshBlock(b){document.querySelectorAll(`input[data-vf][data-b="${b.id}"]`).forEach(el=>{const st=b.sets.find(x=>x.id===el.dataset.s);el.className=st?repCls(b,(st.v||[])[+el.dataset.vf]):""});b.sets.forEach(st=>{const el=document.getElementById("st-"+st.id);if(el)el.innerHTML=statsHTML(b,st)});const r=document.getElementById("recap"),s=cur();if(r&&s)r.innerHTML=recapHTML(s)}
function recapHTML(s){
  const blocks=(s.blocks||[]).filter(b=>(b.sets||[]).some(st=>setStats(st)));
  if(!blocks.length)return '<div class="empty">Le graphique apparaît dès que tu saisis des vitesses.</div>';
  return blocks.map(b=>{
    const m=move(b.mv),halt=m.type==="haltero";
    const sets=b.sets.map((st,i)=>({i,st,k:setStats(st)}));
    const done=sets.filter(x=>x.k);
    const lo=num(b.vmin),hi=num(b.vmax),vlm=num(b.vlMax);
    const W=340,H=170,L=34,R=8,T=18,B=34;
    const vmaxData=Math.max(...done.map(x=>x.k.best),hi||0,lo||0);
    const step=Math.ceil(vmaxData*1.15/4*10)/10||0.3;const ymax=step*4;
    const Y=v=>T+(1-v/ymax)*(H-T-B);
    const n=sets.length,slot=(W-L-R)/n,bw=Math.min(38,slot*0.6);
    let g="";
    for(let i=0;i<=4;i++){const v=ymax*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmt(v,1)}</text>`}
    if(lo!=null||hi!=null){const a=hi!=null?Math.min(hi,ymax):ymax,z=lo!=null?lo:0;g+=`<rect x="${L}" y="${Y(a)}" width="${W-L-R}" height="${Math.max(0,Y(z)-Y(a))}" fill="var(--accent)" opacity=".13"/>`}
    sets.forEach(({i,st,k})=>{
      const cx=L+slot*(i+0.5);
      if(k){
        const stop=vlm!=null&&k.vl!=null&&k.vl>vlm;
        const col=lo!=null&&k.best<lo?"var(--warn)":hi!=null&&k.best>hi?"var(--fast)":"var(--accent)";
        g+=`<rect x="${cx-bw/2}" y="${Y(k.best)}" width="${bw}" height="${Y(0)-Y(k.best)}" rx="3" fill="${col}"/>`;
        if(k.n>1)g+=`<line x1="${cx-bw/2-3}" x2="${cx+bw/2+3}" y1="${Y(k.last)}" y2="${Y(k.last)}" stroke="${stop?"var(--bad)":"var(--text)"}" stroke-width="2"/>`;
        g+=`<text x="${cx}" y="${Y(k.best)-5}" text-anchor="middle" font-size="10.5" font-weight="700" font-family="Space Grotesk" fill="var(--text)">${fmt(k.best)}</text>`;
      }
      g+=`<text x="${cx}" y="${H-19}" text-anchor="middle" font-size="9.5" fill="var(--muted)">S${i+1}</text><text x="${cx}" y="${H-7}" text-anchor="middle" font-size="9.5" font-family="Space Grotesk" fill="var(--text)">${st.load!=null?show(st.load)+" kg":"–"}</text>`;
    });
    const best=Math.max(...done.map(x=>x.k.best)),topLoad=Math.max(0,...done.map(x=>x.st.load||0));
    const inT=(lo!=null||hi!=null)?done.filter(x=>!((lo!=null&&x.k.best<lo)||(hi!=null&&x.k.best>hi))).length:null;
    return `<div class="card" style="margin-top:10px">
      <div class="row" style="justify-content:space-between;align-items:baseline"><h3>${esc(m.name)}</h3><span class="kind">${halt?"vitesse pic":"vitesse moyenne"}, m/s</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Meilleure vitesse par série, ${esc(m.name)}" font-family="Inter, sans-serif" style="margin-top:6px">${g}</svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Meilleure rep</span><span><i style="background:var(--text);border-radius:1px;height:2px;width:12px;vertical-align:3px"></i>Dernière rep</span>${lo!=null||hi!=null?'<span><i style="background:var(--accent);opacity:.3;border-radius:2px"></i>Cible</span><span><i style="background:var(--fast)"></i>Trop rapide</span><span><i style="background:var(--warn)"></i>Trop lent</span>':""}</div>
      <div class="stats" style="margin-top:8px"><div class="nums"><span><span class="k">Séries </span><b>${done.length}/${sets.length}</b></span><span><span class="k">Charge max </span><b>${topLoad?show(topLoad)+" kg":"–"}</b></span><span><span class="k">Meilleure </span><b>${fmt(best)}</b></span>${inT!=null?`<span><span class="k">Dans la cible </span><b>${inT}/${done.length}</b></span>`:""}</div></div>
    </div>`;
  }).join("");
}

/* ---------- Démarrage ---------- */
connect();
})();
</script>
