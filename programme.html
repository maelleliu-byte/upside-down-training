<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Programmations · Upside Down Training</title>
<meta name="description" content="Programmations Upside Down Training : Training, Affiliate, HYROX, 3 Days Program, Running Club, Toes to Bar. Coaching CrossFit, HYROX et running à Saint-Vit, Dole et Besançon.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Upside Down Training">
<meta property="og:title" content="Programmations · Upside Down Training">
<meta property="og:description" content="Choisis ta programmation : Training, Affiliate, HYROX, 3 Days Program, Running Club, Toes to Bar.">
<meta property="og:image" content="https://app.upsidedown-training.fr/img/progs/training.jpg">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#050506;color:#ededed;font-family:"DM Sans",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:10px 0 40px}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .brand b{font-family:"Bebas Neue",sans-serif;letter-spacing:2px;font-weight:400;font-size:20px}
  .brand a{white-space:nowrap;color:#2dd4bf;font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid rgba(45,212,191,.5);border-radius:10px;padding:7px 11px}
  .more{display:block;text-align:center;color:#8a8f96;font-size:13px;margin:18px 0 0}
  .more a{color:#2dd4bf}
  .foot{color:#5f6368;font-size:11px;text-align:center;margin-top:26px}
  /* Grille ordinateur : cartes de même hauteur, prix alignés en bas */
  .v-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:stretch;padding:6px 16px 30px}
  .v-wide .v-card{max-width:none;width:100%;margin:0;display:flex;flex-direction:column}
  .v-wide .v-hw{height:300px}
  .v-wide .v-sec{flex:1}
  /* Mode intégration (iframe sur upsidedown-training.fr) : sans barre ni pied */
  html.embed,html.embed body{background:transparent}
  html.embed .brand,html.embed .foot,html.embed .v-head{display:none}
  html.embed .wrap{padding:0}
</style>
<script>
  /* ?embed=1 → vitrine intégrée dans le site principal */
  window.UDT_EMBED = /[?&]embed=1\b/.test(location.search);
  if (window.UDT_EMBED) document.documentElement.classList.add('embed');
</script>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>UPSIDE DOWN TRAINING</b><a href="/">Se connecter</a></div>
  <div class="v-head" style="padding-top:4px"><h2 style="font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-weight:400;font-size:30px;margin:0">NOS PROGRAMMATIONS</h2><p style="margin:4px 0 6px;font-size:13px;color:#8a8f96">7 jours d'essai gratuits sur les abonnements · sans engagement</p></div>
  <div id="vitrine-root"><div style="padding:60px;text-align:center;color:#8a8f96">Chargement…</div></div>
  <div class="foot">Upside Down Training · CrossFit Sandglass</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/vitrine.js?v=20261121e"></script>
<script>
(async function () {
  var SUPABASE_URL = 'https://tltqtpbaaxiwwpvuzszt.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsdHF0cGJhYXhpd3dwdnV6c3p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDA5NTQsImV4cCI6MjA5MzUxNjk1NH0.5LVedQ-ktLcTC6z2X0XIoqY-mqP9_tw-gzrt-KNfuuY';
  var V = window.udtVitrine; V.css();
  /* Prix et couleurs : lus en direct (fonction publique vitrine_programmes), sinon valeurs par défaut */
  var FALLBACK = [
    { slug: 'training', name: 'Training', color: '#ff8c47', type: 'subscription', price_monthly: 45, has_stripe: true },
    { slug: 'affiliate', name: 'Affiliate', color: '#e8ff47', type: 'subscription', price_monthly: 120, has_stripe: true },
    { slug: 'hyrox', name: 'HYROX', color: '#ff479c', type: 'subscription', price_monthly: 30, has_stripe: true },
    { slug: '3-days-prgm', name: '3 DAYS PRGM', color: '#cccccc', type: 'subscription', price_monthly: 35, has_stripe: true },
    { slug: 'running-club', name: 'RUNNING CLUB', color: '#7c47ff', type: 'subscription', price_monthly: 30, has_stripe: true },
    { slug: 'fix-toes-to-bar', name: 'TOES TO BAR', color: '#c847ff', type: 'oneshot', price_oneshot: 50, has_stripe: true },
    { slug: 'kids', name: 'KIDS-TEENS', color: '#47a8ff', type: 'subscription', price_monthly: 30, has_stripe: false }
  ];
  var rows = FALLBACK;
  try {
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var r = await sb.rpc('vitrine_programmes');
    if (r && !r.error && r.data && r.data.length) rows = r.data.map(function (x) { return Object.assign({ vitrine_visible: true }, x); });
  } catch (e) { }
  V.setRows(rows);
  rows = rows.filter(function (p) { return V.inVitrine(p.slug); })
    .sort(function (a, b) { return V.orderIndex(a.slug) - V.orderIndex(b.slug); });

  /* /p/<lien> → un programme ; /programmes → tous */
  var m = location.pathname.match(/^\/p\/([^\/?#]+)/);
  var one = m ? V.slugFromLink(decodeURIComponent(m[1])) : null;
  var list = one ? rows.filter(function (p) { return p.slug === one; }) : rows;

  window.udtStart = function (slug) {
    var c = V.cfgOf(slug);
    try { localStorage.setItem('udt_pending_prog', c ? c.link : slug); } catch (e) { }
    var url = '/?prog=' + encodeURIComponent(c ? c.link : slug);
    if (window.UDT_EMBED) {
      /* depuis le site principal : on ouvre l'app en pleine page */
      url = V.PUBLIC_BASE + url;
      try { window.top.location.href = url; } catch (e) { window.open(url, '_blank'); }
      return;
    }
    location.href = url;
  };
  var root = document.getElementById('vitrine-root');
  /* Ordinateur : toutes les cartes côte à côte. Téléphone (ou lien /p/...) : onglets, une carte à la fois. */
  var WIDE = window.matchMedia('(min-width: 900px)');
  var mode = null;
  function cardOpts(p) { return { base: '/', ctaAction: "udtStart('" + p.slug + "')" }; }
  function layout() {
    var want = (WIDE.matches && !one) ? 'grid' : 'tabs';
    if (want === mode) return;
    mode = want;
    /* conteneur neuf : retire les écouteurs de la vue précédente */
    var fresh = root.cloneNode(false); root.parentNode.replaceChild(fresh, root); root = fresh;
    if (mode === 'grid') {
      root.innerHTML = '<div class="v-wide">' + rows.map(function (p) { return V.cardHTML(p, cardOpts(p)); }).join('') + '</div>';
      return;
    }
    var br = V.mountBrowser(root, rows, {
      noGrid: true, base: '/',
      cardOpts: cardOpts,
      onChange: function (slug) {
        var c = slug && V.cfgOf(slug);
        var path = c ? '/p/' + c.link : '/programmes';
        if (location.pathname !== path) history.replaceState(null, '', path + location.search);
        document.title = c ? c.titleText + ' · Programmation Upside Down Training' : 'Programmations · Upside Down Training';
      }
    });
    br.showSlug(one);
  }
  layout();
  if (WIDE.addEventListener) WIDE.addEventListener('change', layout); else if (WIDE.addListener) WIDE.addListener(layout);

  /* En intégration : envoie la hauteur au site parent pour ajuster l'iframe */
  if (window.UDT_EMBED && window.parent !== window) {
    var lastH = 0;
    var sendH = function () {
      var w = document.querySelector('.wrap');
      var h = Math.ceil(w ? w.getBoundingClientRect().height : document.body.scrollHeight);
      if (h !== lastH) { lastH = h; window.parent.postMessage({ type: 'udt-vitrine-height', height: h }, '*'); }
    };
    if (window.ResizeObserver) new ResizeObserver(sendH).observe(document.querySelector('.wrap') || document.body);
    window.addEventListener('load', sendH); setInterval(sendH, 1000); sendH();
  }

  if (one && list.length === 1) {
    var c = V.cfgOf(one), p = list[0];
    var name = c.titleText;
    document.title = name + ' · Programmation Upside Down Training';
    var d = document.querySelector('meta[name="description"]'); if (d) d.setAttribute('content', c.tag + ' ' + c.desc);
    var t = document.querySelector('meta[property="og:title"]'); if (t) t.setAttribute('content', name + ' · Upside Down Training');
    var od = document.querySelector('meta[property="og:description"]'); if (od) od.setAttribute('content', c.tag);
    var oi = document.querySelector('meta[property="og:image"]'); if (oi && c.photo) oi.setAttribute('content', /^https?:/.test(c.photo) ? c.photo : V.PUBLIC_BASE + c.photo);
  }
})();
</script>
</body>
</html>
