[build]
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "index.html,core.js,admin.js,planning.js,wellness.js,abos.js,styles.css,debug.html,register.html"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_SERVICE_KEY"

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

# Vitrine publique des programmations (liens courts) — avant les routes studio
[[redirects]]
  from = "/p/:lien"
  to = "/programme.html"
  status = 200

[[redirects]]
  from = "/programmes"
  to = "/programme.html"
  status = 200

[[redirects]]
  from = "/:studio/settings"
  to = "/studio-settings.html"
  status = 200

[[redirects]]
  from = "/:studio"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/:studio/*"
  to = "/index.html"
  status = 200
  force = false

# L'application est reservee aux membres : chaque page HTML de l'app porte
# <meta name="robots" content="noindex">. Seule la vitrine (/programmes, /p/...)
# est indexable par Google. Les fichiers JS/JSON restent hors index.
[[headers]]
  for = "/*.js"
  [headers.values]
    X-Robots-Tag = "noindex"
